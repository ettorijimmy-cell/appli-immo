# Décision du 2026-10-18 : candidat n'est pas publiée et n'a aucun Sync
# Stream, ni la branche documents/diagnostics entite_type='candidat' (voir
# le commentaire du stream documents plus haut dans ce fichier). Raison :
# la publication Postgres porte sur la table entière, donc publier
# candidat copierait vers PowerSync Cloud les revenus des candidats et de
# leurs garants (revenu_mensuel_net, garant_revenu_mensuel_net), même si
# aucun stream ne les envoie au poste. Les écrans Candidats lisent via le
# backend. Revenir sur ce choix exige une décision explicite.
