# Domaine État des lieux (2026-08-21) : RÉSOLU — la 6e branche
# manquante du Sync Stream documents/diagnostics (entite_type =
# 'etat_des_lieux') a été ajoutée séparément, voir le bloc documents/
# diagnostics ci-dessus.

  # Préparé le 2026-08-21, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi. Domaine Alertes, dernier
  # domaine de ce chantier — voir la note "Domaine Alertes (2026-08-16)"
  # ci-dessus pour l'historique du report.
  # entite_id est une référence polymorphe sur 4 cibles selon `type` (pas
  # de FK possible, voir commentaire du schéma Drizzle,
  # packages/db/src/schema/alertes.ts) : bail_fin_proche -> baux, impaye
  # -> paiements, document_expire/document_expire_proche -> documents,
  # entretien_equipement -> equipements. 5 blocs OR (pas UNION ALL — leçon
  # retenue du domaine Documents), chacun avec sa propre chaîne de
  # filtrage vers la table cible correspondante.
  # Corrigé le 2026-08-21 : `alertes.type IN ('document_expire',
  # 'document_expire_proche')` (liste de valeurs littérales) rejeté par le
  # dashboard PowerSync — "This expression is not supported by
  # PowerSync". IN avec une sous-requête SELECT fonctionne partout
  # ailleurs dans ce chantier ; IN avec des valeurs littérales ne l'est
  # pas. document_expire et document_expire_proche ont donc chacun leur
  # propre bloc OR, avec le même filtre vers documents dupliqué deux fois
  # (5 blocs au total, pas 4) plutôt que mutualisé.
  # Chacune des deux branches document_expire(_proche) réutilise intégralement le filtre
  # polymorphe à 7 branches de documents (documents.entite_type IN
  # sci/immeuble/appartement/bail/garant/locataire/etat_des_lieux) en sous-
  # requête — la chaîne la plus profonde et la plus complexe de ce
  # chantier à ce jour, jusqu'à 6 niveaux d'imbrication (alertes ->
  # documents -> etats_des_lieux -> baux -> appartements -> bien ->
  # utilisateurs, migré le 2026-08-26) — à surveiller en priorité côté
  # temps de réponse une fois déployé.
  # derniere_condition_vraie EXCLU (champ interne, jamais exposé à
  # l'utilisateur selon le commentaire du schéma — décision actée dès la
  # découverte de ce domaine, 2026-08-16). Vérifié programmatiquement le
  # 2026-08-21 : absent de la requête ci-dessous. Toutes les autres
  # colonnes métier incluses.
  alertes:
    query: >
      SELECT id, type, entite_id, statut, message, date_reference, updated_at
      FROM alertes
      WHERE (
        alertes.type = 'bail_fin_proche' AND alertes.entite_id IN (
          SELECT id FROM baux WHERE baux.appartement_id IN (
            SELECT id FROM appartements WHERE appartements.bien_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          )
        )
      ) OR (
        alertes.type = 'impaye' AND alertes.entite_id IN (
          SELECT id FROM paiements WHERE paiements.bail_id IN (
            SELECT id FROM baux WHERE baux.appartement_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          )
        )
      ) OR (
        alertes.type = 'document_expire' AND alertes.entite_id IN (
          SELECT id FROM documents WHERE (
            documents.entite_type = 'sci' AND documents.entite_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          ) OR (
            documents.entite_type = 'immeuble' AND documents.entite_id IN (
              SELECT id FROM immeubles_legacy WHERE immeubles_legacy.sci_id IN (
                SELECT organisation_sci.sci_id FROM organisation_sci
                INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
                WHERE utilisateurs.id = auth.user_id()
                AND organisation_sci.date_fin IS NULL
              )
            )
          ) OR (
            documents.entite_type = 'bien' AND documents.entite_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          ) OR (
            documents.entite_type = 'appartement' AND documents.entite_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          ) OR (
            documents.entite_type = 'bail' AND documents.entite_id IN (
              SELECT id FROM baux WHERE baux.appartement_id IN (
                SELECT id FROM appartements WHERE appartements.bien_id IN (
                  SELECT id FROM bien WHERE bien.organisation_id IN (
                    SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                  )
                )
              )
            )
          ) OR (
            documents.entite_type = 'garant' AND documents.entite_id IN (
              SELECT id FROM garants WHERE garants.bail_id IN (
                SELECT id FROM baux WHERE baux.appartement_id IN (
                  SELECT id FROM appartements WHERE appartements.bien_id IN (
                    SELECT id FROM bien WHERE bien.organisation_id IN (
                      SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                    )
                  )
                )
              )
            )
          ) OR (
            documents.entite_type = 'locataire' AND documents.entite_id IN (
              SELECT locataire_id FROM bail_locataires WHERE bail_locataires.bail_id IN (
                SELECT id FROM baux WHERE baux.appartement_id IN (
                  SELECT id FROM appartements WHERE appartements.bien_id IN (
                    SELECT id FROM bien WHERE bien.organisation_id IN (
                      SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                    )
                  )
                )
              )
              AND bail_locataires.archived_at IS NULL
            )
          ) OR (
            documents.entite_type = 'etat_des_lieux' AND documents.entite_id IN (
              SELECT id FROM etats_des_lieux WHERE etats_des_lieux.bail_id IN (
                SELECT id FROM baux WHERE baux.appartement_id IN (
                  SELECT id FROM appartements WHERE appartements.bien_id IN (
                    SELECT id FROM bien WHERE bien.organisation_id IN (
                      SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                    )
                  )
                )
              )
            )
          )
        )
      ) OR (
        alertes.type = 'document_expire_proche' AND alertes.entite_id IN (
          SELECT id FROM documents WHERE (
            documents.entite_type = 'sci' AND documents.entite_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          ) OR (
            documents.entite_type = 'immeuble' AND documents.entite_id IN (
              SELECT id FROM immeubles_legacy WHERE immeubles_legacy.sci_id IN (
                SELECT organisation_sci.sci_id FROM organisation_sci
                INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
                WHERE utilisateurs.id = auth.user_id()
                AND organisation_sci.date_fin IS NULL
              )
            )
          ) OR (
            documents.entite_type = 'bien' AND documents.entite_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          ) OR (
            documents.entite_type = 'appartement' AND documents.entite_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          ) OR (
            documents.entite_type = 'bail' AND documents.entite_id IN (
              SELECT id FROM baux WHERE baux.appartement_id IN (
                SELECT id FROM appartements WHERE appartements.bien_id IN (
                  SELECT id FROM bien WHERE bien.organisation_id IN (
                    SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                  )
                )
              )
            )
          ) OR (
            documents.entite_type = 'garant' AND documents.entite_id IN (
              SELECT id FROM garants WHERE garants.bail_id IN (
                SELECT id FROM baux WHERE baux.appartement_id IN (
                  SELECT id FROM appartements WHERE appartements.bien_id IN (
                    SELECT id FROM bien WHERE bien.organisation_id IN (
                      SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                    )
                  )
                )
              )
            )
          ) OR (
            documents.entite_type = 'locataire' AND documents.entite_id IN (
              SELECT locataire_id FROM bail_locataires WHERE bail_locataires.bail_id IN (
                SELECT id FROM baux WHERE baux.appartement_id IN (
                  SELECT id FROM appartements WHERE appartements.bien_id IN (
                    SELECT id FROM bien WHERE bien.organisation_id IN (
                      SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                    )
