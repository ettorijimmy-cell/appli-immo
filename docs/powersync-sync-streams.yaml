# Source de vérité versionnée pour les Sync Streams PowerSync de ce projet.
#
# Ce fichier N'EST PAS lu ni exécuté automatiquement par PowerSync — la
# configuration réelle vit exclusivement dans le dashboard PowerSync
# (Client Auth / Sync Streams), collée et déployée manuellement par
# l'utilisateur ("Save and Deploy"). Ce fichier sert uniquement à garder un
# historique lisible et versionné (git) de ce qui est censé être déployé,
# et à servir de base pour préparer/réviser un stream avant de le coller
# dans le dashboard.
#
# Toute divergence constatée entre ce fichier et le contenu réellement
# déployé dans le dashboard doit être traitée comme un bug de process
# (oubli de mise à jour de ce fichier après un changement dans le
# dashboard, ou inversement) — jamais comme un état normal. En cas de
# doute sur l'état réellement déployé, le dashboard PowerSync fait
# autorité, pas ce fichier.
#
# Règles à respecter pour tout nouveau stream ajouté ici (voir
# docs/data-dictionary.md, section Authentification et autorisation, et
# docs/backlog.md) :
#   - Jamais SELECT * — toujours une liste de colonnes explicite,
#     correspondant exactement à ce qu'on accepte de voir stocké en clair
#     sur l'appareil local.
#   - journal_audit ne doit jamais faire l'objet d'un stream — protégée
#     structurellement en amont (absente de la publication Postgres), pas
#     par une simple discipline de requête.

config:
  edition: 3

streams:
  # Déployé le 2026-08-13, corrigé le 2026-08-13 (SELECT * initial ->
  # colonnes explicites après avoir constaté que ps_data__scis contenait
  # des colonnes non voulues). Testé de bout en bout (Postgres Scaleway ->
  # PowerSync -> SQLite locale), y compris après restriction des IPs
  # autorisées côté Postgres.
  scis:
    query: >
      SELECT id, nom, regime_fiscal, statut FROM scis
      WHERE scis.id IN (
        SELECT organisation_sci.sci_id FROM organisation_sci
        INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
        WHERE utilisateurs.id = auth.user_id()
        AND organisation_sci.date_fin IS NULL
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de la
  # création de ce fichier — voir docs/backlog.md pour le suivi.
  # Même logique de portée que scis (organisation_sci -> utilisateurs ->
  # auth.user_id()), immeubles ayant une FK directe sci_id.
  # identifiant_fiscal n'existe pas sur cette table (présent sur
  # appartements) — sans objet ici.
  immeubles:
    query: >
      SELECT id, sci_id, nom, adresse, code_postal, ville, type_habitat,
      regime_juridique, annee_construction, statut, updated_at FROM immeubles
      WHERE immeubles.sci_id IN (
        SELECT organisation_sci.sci_id FROM organisation_sci
        INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
        WHERE utilisateurs.id = auth.user_id()
        AND organisation_sci.date_fin IS NULL
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de la
  # création de ce fichier — voir docs/backlog.md pour le suivi.
  # Pas de sci_id direct sur appartements : filtrage via immeuble_id ->
  # immeubles.sci_id -> organisation_sci -> utilisateurs (sous-select à
  # 3 niveaux, jamais testé à cette profondeur avant ce stream — à
  # surveiller côté temps de réponse une fois déployé).
  # identifiant_fiscal EXCLU volontairement de la liste de colonnes
  # (donnée fiscale nominative du lot, plus sensible que le reste des
  # colonnes de cette table — voir échange du 2026-08-15).
  appartements:
    query: >
      SELECT id, immeuble_id, numero, type, surface, loyer_reference,
      nombre_pieces_principales, mode_chauffage, mode_eau_chaude, type_energie,
      equipement_cuisine, dependances_annexes, nombre_chambres,
      nombre_salles_de_bain, nombre_wc, autre_piece_1, autre_piece_2, statut,
      updated_at FROM appartements
      WHERE appartements.immeuble_id IN (
        SELECT id FROM immeubles WHERE immeubles.sci_id IN (
          SELECT organisation_sci.sci_id FROM organisation_sci
          INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
          WHERE utilisateurs.id = auth.user_id()
          AND organisation_sci.date_fin IS NULL
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Pas de statut sur cette table (contrairement à scis/immeubles/
  # appartements) — aucun pgEnum de statut défini côté Drizzle.
  # Pas de appartement_id -> immeuble_id -> sci_id direct à 3 niveaux comme
  # appartements : equipements n'a qu'une FK vers appartements (pas de
  # immeuble_id propre), d'où un sous-select à 4 niveaux (equipements ->
  # appartements -> immeubles -> organisation_sci -> utilisateurs), un de
  # plus que appartements — jamais testé à cette profondeur avant ce
  # stream, à surveiller côté temps de réponse une fois déployé (voir
  # aussi l'entrée dette technique sur la mesure encore en attente pour
  # appartements, docs/backlog.md).
  # Aucune colonne sensible identifiée sur cette table (vérifié le
  # 2026-08-15) — les 4 colonnes métier (appartement_id, type,
  # date_dernier_entretien, intervalle_entretien_mois) sont toutes
  # incluses, contrairement à identifiant_fiscal exclu sur appartements.
  equipements:
    query: >
      SELECT id, appartement_id, type, date_dernier_entretien,
      intervalle_entretien_mois, updated_at FROM equipements
      WHERE equipements.appartement_id IN (
        SELECT id FROM appartements WHERE appartements.immeuble_id IN (
          SELECT id FROM immeubles WHERE immeubles.sci_id IN (
            SELECT organisation_sci.sci_id FROM organisation_sci
            INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
            WHERE utilisateurs.id = auth.user_id()
            AND organisation_sci.date_fin IS NULL
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi. Domaine Locataires & baux.
  # Même profondeur que appartements (3 niveaux : appartement_id ->
  # immeubles.sci_id -> organisation_sci -> utilisateurs), appartement_id
  # étant une FK directe sur baux. Aucune colonne exclue — rien de sensible
  # identifié sur cette table (voir échange du 2026-08-15).
  baux:
    query: >
      SELECT id, appartement_id, type_bail, statut, loyer_mensuel,
      depot_garantie, provisions_charges, jour_echeance, date_debut,
      date_fin, date_activation, date_signature, date_resiliation,
      travaux_realises, honoraires_bailleur, honoraires_locataire,
      updated_at FROM baux
      WHERE baux.appartement_id IN (
        SELECT id FROM appartements WHERE appartements.immeuble_id IN (
          SELECT id FROM immeubles WHERE immeubles.sci_id IN (
            SELECT organisation_sci.sci_id FROM organisation_sci
            INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
            WHERE utilisateurs.id = auth.user_id()
            AND organisation_sci.date_fin IS NULL
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Même chaîne de filtrage que baux, un niveau de plus (bail_id ->
  # appartement_id -> immeubles.sci_id -> organisation_sci -> utilisateurs,
  # 4 niveaux, comme equipements).
  # profession et revenus EXCLUS volontairement (donnée financière précise
  # du garant, pas de besoin hors-ligne — décision du 2026-08-15). Toutes
  # les autres colonnes métier incluses.
  garants:
    query: >
      SELECT id, bail_id, nom, prenom, email, telephone, type_garantie,
      adresse, code_postal, ville, date_naissance, lieu_naissance,
      nationalite, updated_at FROM garants
      WHERE garants.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.immeuble_id IN (
            SELECT id FROM immeubles WHERE immeubles.sci_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Table de jonction pure (colocation) — mêmes 4 niveaux que garants
  # (bail_id -> appartement_id -> immeubles.sci_id -> organisation_sci ->
  # utilisateurs). Aucune colonne sensible : juste deux UUID + un enum de
  # rôle. Toutes les colonnes incluses.
  bail_locataires:
    query: >
      SELECT id, bail_id, locataire_id, role, updated_at FROM bail_locataires
      WHERE bail_locataires.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.immeuble_id IN (
            SELECT id FROM immeubles WHERE immeubles.sci_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-15, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Le niveau le plus profond du projet à ce jour (5 niveaux) : locataires
  # n'a AUCUNE FK directe vers baux/appartements/immeubles/sci (c'est une
  # entité indépendante, partagée entre plusieurs baux dans le temps — voir
  # échange du 2026-08-15) — filtrage obligatoire via la table de jonction
  # bail_locataires (locataire_id -> bail_id -> appartement_id ->
  # immeubles.sci_id -> organisation_sci -> utilisateurs). Filtre sur
  # bail_locataires.archived_at IS NULL : un locataire retiré d'un bail
  # (ligne de liaison archivée) ne doit pas continuer à donner accès à ce
  # bail pour le calcul de portée. Jamais testé à cette profondeur — à
  # surveiller particulièrement côté temps de réponse une fois déployé.
  # Toutes les colonnes métier incluses, y compris anonymise_le (décision
  # du 2026-08-15 : mécanisme RGPD non implémenté à ce jour — voir
  # docs/backlog.md, dette technique — mais la colonne doit déjà être
  # présente côté client pour le jour où il le sera).
  locataires:
    query: >
      SELECT id, nom, prenom, email, telephone, adresse, code_postal, ville,
      date_naissance, statut, anonymise_le, updated_at FROM locataires
      WHERE locataires.id IN (
        SELECT locataire_id FROM bail_locataires WHERE bail_locataires.bail_id IN (
          SELECT id FROM baux WHERE baux.appartement_id IN (
            SELECT id FROM appartements WHERE appartements.immeuble_id IN (
              SELECT id FROM immeubles WHERE immeubles.sci_id IN (
                SELECT organisation_sci.sci_id FROM organisation_sci
                INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
                WHERE utilisateurs.id = auth.user_id()
                AND organisation_sci.date_fin IS NULL
              )
            )
          )
        )
        AND bail_locataires.archived_at IS NULL
      )
    auto_subscribe: true

  # Préparé le 2026-08-16, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi. Domaine Finances.
  # Même profondeur que baux (4 niveaux : bail_id -> appartement_id ->
  # immeubles.sci_id -> organisation_sci -> utilisateurs), bail_id étant une
  # FK directe sur paiements. Aucune colonne exclue — rien de sensible
  # identifié sur cette table (statut est calculé, jamais saisi
  # directement — voir docs/data-dictionary.md).
  paiements:
    query: >
      SELECT id, bail_id, type, statut, montant, date_echeance, updated_at
      FROM paiements
      WHERE paiements.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.immeuble_id IN (
            SELECT id FROM immeubles WHERE immeubles.sci_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-16, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Même chaîne de filtrage que paiements, un niveau de plus (paiement_id ->
  # bail_id -> appartement_id -> immeubles.sci_id -> organisation_sci ->
  # utilisateurs, 5 niveaux, comme locataires).
  # reference_rapprochement EXCLUE volontairement (libellé brut de ligne de
  # relevé bancaire importé — hors de notre contrôle, potentiellement
  # porteur d'informations non maîtrisées selon la banque émettrice —
  # décision du 2026-08-16). Toutes les autres colonnes métier incluses.
  versements:
    query: >
      SELECT id, paiement_id, montant, date_versement, mode, updated_at
      FROM versements
      WHERE versements.paiement_id IN (
        SELECT id FROM paiements WHERE paiements.bail_id IN (
          SELECT id FROM baux WHERE baux.appartement_id IN (
            SELECT id FROM appartements WHERE appartements.immeuble_id IN (
              SELECT id FROM immeubles WHERE immeubles.sci_id IN (
                SELECT organisation_sci.sci_id FROM organisation_sci
                INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
                WHERE utilisateurs.id = auth.user_id()
                AND organisation_sci.date_fin IS NULL
              )
            )
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-16, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Deux FK vers deux niveaux différents (bail_id, ancre stable toujours
  # présente ; paiement_id, nullable, lien optionnel vers l'échéance
  # d'origine) — filtrage sur bail_id uniquement, même profondeur que
  # paiements (4 niveaux), pas besoin de passer par paiement_id puisque tout
  # paiement lié appartient nécessairement au même bail.
  # commentaire EXCLU volontairement (texte libre non contraint, saisi
  # manuellement, contenu imprévisible — décision du 2026-08-16). Toutes les
  # autres colonnes métier incluses.
  remboursements:
    query: >
      SELECT id, bail_id, paiement_id, type, montant_origine,
      montant_rembourse, date_remboursement, mode, updated_at
      FROM remboursements
      WHERE remboursements.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.immeuble_id IN (
            SELECT id FROM immeubles WHERE immeubles.sci_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          )
        )
      )
    auto_subscribe: true

# Domaine Alertes (2026-08-16) :
#
# - alertes REPORTÉ après le domaine Documents (pas encore de Sync Stream
#   documents à ce jour). Raison : alertes.entite_id est une référence
#   polymorphe — la table cible dépend de alertes.type (baux pour
#   bail_fin_proche, paiements pour impaye, documents pour
#   document_expire/document_expire_proche, equipements pour
#   entretien_equipement), sans FK possible (voir commentaire du schéma
#   Drizzle, packages/db/src/schema/alertes.ts). Impossible d'écrire la
#   branche document_expire/document_expire_proche du filtre tant que le
#   Sync Stream documents lui-même n'est pas conçu — les deux dépendent
#   l'un de l'autre. derniere_condition_vraie à EXCLURE quand on y
#   reviendra (champ interne, jamais exposé à l'utilisateur selon le
#   commentaire du schéma) — acté dès maintenant pour ne pas l'oublier.
#
# - parametres_alertes : config globale mono-utilisateur (une ligne par
#   type d'alerte, 5 lignes maximum, contrainte d'unicité sur `type`),
#   sans rattachement SCI/utilisateur d'aucune sorte (pas de colonne de
#   ce type sur cette table) — synchronisée sans filtre par hiérarchie,
#   contrairement à tous les streams précédents. Rien de sensible (un enum
#   type + un entier seuil_jours_avant) — toutes les colonnes incluses.
  parametres_alertes:
    query: >
      SELECT id, type, seuil_jours_avant, updated_at FROM parametres_alertes
    auto_subscribe: true

  # Préparé le 2026-08-19, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi. Domaine Références
  # globales.
  # Table de référence réglementaire (série INSEE BDM 001515333), sans
  # rattachement SCI/utilisateur — synchronisée sans filtre par hiérarchie,
  # comme parametres_alertes. Rien de sensible.
  # Pas de colonne updated_at sur cette table (contrairement à tous les
  # streams précédents) : indices_irl n'a volontairement pas les
  # auditColumns standard (une valeur IRL publiée n'est jamais modifiée,
  # voir commentaire du schéma Drizzle, packages/db/src/schema/
  # indices-irl.ts) — date_recuperation en tient lieu.
  # Confirmé le 2026-08-19 (requête directe sur pg_publication_tables,
  # script jetable check-publication-indices-irl.ts, supprimé après usage) :
  # indices_irl fait bien partie de la publication Postgres powersync,
  # contrairement à journal_audit qui en est structurellement exclue —
  # sans quoi ce stream n'aurait jamais pu recevoir de données.
  indices_irl:
    query: >
      SELECT id, annee, trimestre, valeur, date_recuperation FROM indices_irl
    auto_subscribe: true

  # Préparé le 2026-08-19, pas encore déployé/testé au moment de l'ajout de
  # ce bloc — voir docs/backlog.md pour le suivi.
  # Catalogue de référence fixe (~85 lignes, seed déjà réalisé — voir
  # commentaire du schéma Drizzle), sans rattachement SCI/utilisateur —
  # synchronisée sans filtre par hiérarchie. Rien de sensible.
  elements_inventaire_meuble:
    query: >
      SELECT id, code, libelle, categorie, ordre_affichage, updated_at
      FROM elements_inventaire_meuble
    auto_subscribe: true

# Décision actée le 2026-08-15 : comptes_bancaires_sci n'a VOLONTAIREMENT
# aucun Sync Stream, et ne doit jamais en avoir un, sous quelque forme
# que ce soit (colonnes chiffrées ibanChiffre/bicChiffre comme non
# chiffrées). Pas de besoin de consultation hors-ligne pour ce champ ;
# l'IBAN/BIC restent consultés à la demande via l'endpoint authentifié
# dédié GET /scis/:id/comptes-bancaires (ComptesBancairesSciService.
# findBySciIdDecrypted, seul point de déchiffrement — voir CLAUDE.md,
# section Sécurité), jamais depuis la base SQLite locale. Vérifié le
# 2026-08-15 : projection déjà explicite côté backend (jamais de spread
# de ligne Drizzle brute), et le frontend desktop (SciDetailView.tsx)
# passe déjà par cet appel API direct, aucune tentative de lecture
# locale. Absence de ce stream = choix délibéré, pas un oubli à
# combler lors d'une future extension par domaine.
