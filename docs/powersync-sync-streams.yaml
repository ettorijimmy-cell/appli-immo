# Source de vérité versionnée pour les Sync Streams PowerSync de ce projet.
#
# Ce fichier N'EST PAS lu ni exécuté automatiquement par PowerSync — la
# configuration réelle vit exclusivement dans le dashboard PowerSync
# (Client Auth / Sync Streams), collée et déployée manuellement par
# l'utilisateur ("Save and Deploy"). Ce fichier sert uniquement à garder un
# historique lisible et versionné (git) de ce qui est censé être déployé,
# et à servir de base pour préparer/réviser un stream avant de le coller
# dans le dashboard.
#
# Toute divergence constatée entre ce fichier et le contenu réellement
# déployé dans le dashboard doit être traitée comme un bug de process
# (oubli de mise à jour de ce fichier après un changement dans le
# dashboard, ou inversement) — jamais comme un état normal. En cas de
# doute sur l'état réellement déployé, le dashboard PowerSync fait
# autorité, pas ce fichier.
#
# Règles à respecter pour tout nouveau stream ajouté ici (voir
# docs/data-dictionary.md, section Authentification et autorisation, et
# docs/backlog.md) :
#   - Jamais SELECT * — toujours une liste de colonnes explicite,
#     correspondant exactement à ce qu'on accepte de voir stocké en clair
#     sur l'appareil local.
#   - journal_audit ne doit jamais faire l'objet d'un stream — protégée
#     structurellement en amont (absente de la publication Postgres), pas
#     par une simple discipline de requête.
#
# État du déploiement (2026-10-22) : configuration complète déployée dans
# le dashboard PowerSync (32 streams au total — tous les streams de ce
# fichier). Déploiement confirmé par connexion réelle depuis l'appli
# desktop packagée (dist/win-unpacked) : powersync.db est passée de 0 à
# 745 Ko.
#   - Streams vérifiés avec des données réelles ce jour-là (comptages
#     observés dans powersync.db) : scis, bien, bien_immeuble_detail,
#     appartements, equipements, baux, alertes, tache, parametres_alertes,
#     indices_irl, elements_inventaire_meuble.
#   - Streams déployés mais non vérifiés, faute de données réelles côté
#     Postgres à ce jour (aucun locataire rattaché, aucun document — état
#     normal de la production actuelle, pas un signe de problème) :
#     immeubles, garants, bail_locataires, locataires, paiements,
#     versements, remboursements, documents, diagnostics, et les 12 tables
#     du domaine État des lieux (etats_des_lieux et ses tables satellites).
#     À vérifier quand des données réelles existeront pour ces domaines —
#     voir docs/backlog.md, entrée "PowerSync — suite".
#
# indices_irl a longtemps été considérée comme jamais confirmée
# fonctionnelle (voir son historique de bug de backfill plus bas dans ce
# fichier) : la cause réelle n'avait rien à voir avec ce stream — la base
# locale powersync.db ne s'ouvrait jamais du tout (extension native
# chargée depuis l'intérieur de app.asar, corrigée le 2026-10-22,
# apps/desktop/src/main/powersync/database.worker.ts, commit bf72015).
# Une fois la base ouverte, indices_irl s'est synchronisée normalement
# (2 lignes reçues).

config:
  edition: 3

streams:
  # Déployé le 2026-08-13, corrigé le 2026-08-13 (SELECT * initial ->
  # colonnes explicites après avoir constaté que ps_data__scis contenait
  # des colonnes non voulues). Testé de bout en bout (Postgres Scaleway ->
  # PowerSync -> SQLite locale), y compris après restriction des IPs
  # autorisées côté Postgres.
  # forme_juridique/siret/adresse/code_postal/ville/nom_gerant/prenom_gerant/
  # telephone/est_familiale et updated_at ajoutés le 2026-10-18 (chantier
  # d'alignement du schéma) : colonnes Drizzle ajoutées après le déploiement
  # initial du 2026-08-13, jamais reportées ici jusqu'à présent. Toutes
  # décidées exposées (aucune donnée sensible — mentions légales du
  # bailleur personne morale et paramètres du bail vide).
  scis:
    query: >
      SELECT id, nom, regime_fiscal, forme_juridique, siret, adresse,
      code_postal, ville, nom_gerant, prenom_gerant, telephone,
      est_familiale, statut, archived_at, version, updated_at FROM scis
      WHERE scis.id IN (
        SELECT organisation_sci.sci_id FROM organisation_sci
        INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
        WHERE utilisateurs.id = auth.user_id()
        AND organisation_sci.date_fin IS NULL
      )
    auto_subscribe: true

  # Même logique de portée que scis (organisation_sci -> utilisateurs ->
  # auth.user_id()), immeubles ayant une FK directe sci_id.
  # identifiant_fiscal n'existe pas sur cette table (présent sur
  # appartements) — sans objet ici.
  # Table renommée immeubles_legacy le 2026-08-27 (décision utilisateur,
  # docs/backlog.md, audit du sort de la table immeubles) : lecture seule
  # définitive côté backend (ImmeublesService n'expose plus que
  # findAll/findById) — documents.entite_type='immeuble' (branche du stream
  # documents/diagnostics/alertes plus bas dans ce fichier) continue de
  # référencer cette table (sous son nouveau nom) directement, pour que les
  # documents historiques restent consultables. Les streams
  # bien/bien_immeuble_detail ci-dessous s'ajoutent à celui-ci, ils ne le
  # remplacent pas.
  immeubles:
    query: >
      SELECT id, sci_id, nom, adresse, code_postal, ville, type_habitat,
      regime_juridique, annee_construction, statut, archived_at, version, updated_at FROM immeubles_legacy
      WHERE immeubles_legacy.sci_id IN (
        SELECT organisation_sci.sci_id FROM organisation_sci
        INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
        WHERE utilisateurs.id = auth.user_id()
        AND organisation_sci.date_fin IS NULL
      )
    auto_subscribe: true

  # Ajouté le 2026-08-26 (migration bien, docs/backlog.md) — nouveau niveau
  # générique au-dessus d'appartement, remplaçant à terme immeubles comme
  # source de vérité pour l'UI (voir Étape 4/5 de la migration), sans le
  # retirer pour l'instant (voir commentaire du stream immeubles ci-dessus).
  # Scoping direct via bien.organisation_id, peuplé à la création (même
  # mécanisme que organisation_sci.organisation_id pour scis/immeubles) —
  # un seul niveau de sous-select, sans branche conditionnelle selon
  # bien.type ni bien.proprietaire_type : couvre aussi bien un immeuble
  # multi-lots détenu par une SCI qu'une maison ou un parking détenu en
  # nom propre (proprietaire_type='personne_physique', sci_id NULL).
  # sci_id inclus à titre informationnel uniquement (jamais utilisé pour le
  # scoping — voir packages/db/src/schema/bien.ts).
  # type_habitat/regime_juridique déplacés depuis bien_immeuble_detail le
  # 2026-08-26 : mentions légales du LOGEMENT (contrat-type, décret
  # n° 2015-587), pas des données de gestion de copropriété — dérivés
  # automatiquement pour type='maison' (jamais null pour ce type), requis
  # explicitement pour tout autre type.
  # nom_proprietaire ajouté le 2026-10-18 (chantier d'alignement du
  # schéma) : colonne Drizzle ajoutée pour Quittance Étape 4
  # (bien.nomProprietaire, mention "LE BAILLEUR" du modèle de bail pour un
  # propriétaire personne physique), jamais reportée ici jusqu'à présent.
  bien:
    query: >
      SELECT id, type, proprietaire_type, sci_id, organisation_id, adresse,
      code_postal, ville, nom, nom_proprietaire, annee_construction,
      date_acquisition, valeur_acquisition, type_habitat, regime_juridique,
      statut, archived_at, version, updated_at
      FROM bien
      WHERE bien.organisation_id IN (
        SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
      )
    auto_subscribe: true

  # Ajouté le 2026-08-26 (migration bien). Extension 1:1 de bien pour le
  # seul type 'immeuble' (packages/db/src/schema/bien-immeuble-detail.ts).
  # Pas de filtre bien.type='immeuble' explicite dans la sous-requête :
  # seuls les biens de type immeuble ont une ligne dans cette table
  # (invariant applicatif posé à l'écriture, pas à la lecture) — la portée
  # par bien_id suffit, inutile de la dupliquer ici.
  # type_habitat/regime_juridique déplacés vers bien le 2026-08-26 (même
  # jour que la création de ce stream) : ne reste ici que syndic/nb_lots/
  # charges_copro_annuelles, purement administratifs, sans équivalent pour
  # un bien non-immeuble.
  bien_immeuble_detail:
    query: >
      SELECT id, bien_id, syndic, nb_lots, charges_copro_annuelles,
      archived_at, version, updated_at FROM bien_immeuble_detail
      WHERE bien_immeuble_detail.bien_id IN (
        SELECT id FROM bien WHERE bien.organisation_id IN (
          SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
        )
      )
    auto_subscribe: true

  # Migré le 2026-08-26 (migration bien, docs/backlog.md) : scoping via
  # bien_id -> bien.organisation_id -> utilisateurs, à la place de l'ancien
  # immeuble_id -> immeubles.sci_id -> organisation_sci -> utilisateurs.
  # Même profondeur de sous-select (2 niveaux), mais un hop en moins réel :
  # bien.organisation_id est peuplé directement à la création (aucune
  # jointure organisation_sci ni condition date_fin à ce niveau, contrairement
  # à l'ancien chemin via immeubles.sci_id). Couvre tous les types de bien
  # (immeuble, maison, appartement_isole, parking, bureau, local_commercial)
  # sans branche conditionnelle sur bien.type ni sur proprietaire_type.
  # identifiant_fiscal EXCLU volontairement de la liste de colonnes
  # (donnée fiscale nominative du lot, plus sensible que le reste des
  # colonnes de cette table — voir échange du 2026-08-15).
  # tantieme/classe_dpe/depenses_energie_min/depenses_energie_max/
  # annee_reference_prix_energie ajoutées le 2026-10-18 (chantier
  # d'alignement du schéma) : colonnes Drizzle ajoutées pour l'Étape 4
  # (composition, DPE), jamais reportées ici jusqu'à présent.
  # identifiant_fiscal reste EXCLU (voir commentaire plus haut).
  appartements:
    query: >
      SELECT id, bien_id, numero, type, surface, loyer_reference,
      nombre_pieces_principales, mode_chauffage, mode_eau_chaude, type_energie,
      equipement_cuisine, dependances_annexes, nombre_chambres,
      nombre_salles_de_bain, nombre_wc, autre_piece_1, autre_piece_2,
      tantieme, classe_dpe, depenses_energie_min, depenses_energie_max,
      annee_reference_prix_energie, statut,
      archived_at, version, updated_at FROM appartements
      WHERE appartements.bien_id IN (
        SELECT id FROM bien WHERE bien.organisation_id IN (
          SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
        )
      )
    auto_subscribe: true

  # Pas de statut sur cette table (contrairement à scis/immeubles/
  # appartements) — aucun pgEnum de statut défini côté Drizzle.
  # Pas de appartement_id -> bien_id direct comme appartements : equipements
  # n'a qu'une FK vers appartements (pas de bien_id propre), d'où un sous-
  # select à 3 niveaux (equipements -> appartements -> bien -> utilisateurs),
  # un de plus qu'appartements — migré le 2026-08-26 (migration bien) vers
  # la chaîne bien_id -> bien.organisation_id, à la place de l'ancienne
  # chaîne immeuble_id -> immeubles.sci_id -> organisation_sci — jamais
  # testé à cette profondeur avant ce stream, à surveiller côté temps de
  # réponse une fois déployé (voir aussi l'entrée dette technique sur la
  # mesure encore en attente pour appartements, docs/backlog.md).
  # Aucune colonne sensible identifiée sur cette table (vérifié le
  # 2026-08-15) — les 4 colonnes métier (appartement_id, type,
  # date_dernier_entretien, intervalle_entretien_mois) sont toutes
  # incluses, contrairement à identifiant_fiscal exclu sur appartements.
  equipements:
    query: >
      SELECT id, appartement_id, type, date_dernier_entretien,
      intervalle_entretien_mois, archived_at, version, updated_at FROM equipements
      WHERE equipements.appartement_id IN (
        SELECT id FROM appartements WHERE appartements.bien_id IN (
          SELECT id FROM bien WHERE bien.organisation_id IN (
            SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
          )
        )
      )
    auto_subscribe: true

  # Domaine Locataires & baux.
  # Même profondeur que appartements (2 niveaux : appartement_id ->
  # bien_id -> bien.organisation_id -> utilisateurs, migré le 2026-08-26),
  # appartement_id étant une FK directe sur baux. Aucune colonne exclue —
  # rien de sensible identifié sur cette table (voir échange du 2026-08-15).
  # trimestre_reference_revision ajoutée le 2026-10-18 (chantier
  # d'alignement du schéma) : colonne Drizzle ajoutée pour le module
  # Révision loyer, jamais reportée ici jusqu'à présent.
  baux:
    query: >
      SELECT id, appartement_id, type_bail, statut, loyer_mensuel,
      depot_garantie, provisions_charges, jour_echeance, date_debut,
      date_fin, date_activation, date_signature, date_resiliation,
      travaux_realises, honoraires_bailleur, honoraires_locataire,
      trimestre_reference_revision,
      archived_at, version, updated_at FROM baux
      WHERE baux.appartement_id IN (
        SELECT id FROM appartements WHERE appartements.bien_id IN (
          SELECT id FROM bien WHERE bien.organisation_id IN (
            SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
          )
        )
      )
    auto_subscribe: true

  # Même chaîne de filtrage que baux, un niveau de plus (bail_id ->
  # appartement_id -> bien_id -> bien.organisation_id -> utilisateurs,
  # 3 niveaux, comme equipements — migré le 2026-08-26).
  # profession et revenus EXCLUS volontairement (donnée financière précise
  # du garant, pas de besoin hors-ligne — décision du 2026-08-15). Toutes
  # les autres colonnes métier incluses.
  garants:
    query: >
      SELECT id, bail_id, nom, prenom, email, telephone, type_garantie,
      adresse, code_postal, ville, date_naissance, lieu_naissance,
      nationalite, archived_at, version, updated_at FROM garants
      WHERE garants.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.bien_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      )
    auto_subscribe: true

  # Table de jonction pure (colocation) — mêmes 3 niveaux que garants
  # (bail_id -> appartement_id -> bien_id -> bien.organisation_id ->
  # utilisateurs, migré le 2026-08-26). Aucune colonne sensible : juste
  # deux UUID + un enum de rôle. Toutes les colonnes incluses.
  bail_locataires:
    query: >
      SELECT id, bail_id, locataire_id, role, archived_at, version, updated_at FROM bail_locataires
      WHERE bail_locataires.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.bien_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      )
    auto_subscribe: true

  # Le niveau le plus profond du projet à ce jour (4 niveaux, migré le
  # 2026-08-26) : locataires n'a AUCUNE FK directe vers baux/appartements/
  # bien (c'est une entité indépendante, partagée entre plusieurs baux dans
  # le temps — voir échange du 2026-08-15) — filtrage obligatoire via la
  # table de jonction bail_locataires (locataire_id -> bail_id ->
  # appartement_id -> bien_id -> bien.organisation_id -> utilisateurs).
  # Filtre sur
  # bail_locataires.archived_at IS NULL : un locataire retiré d'un bail
  # (ligne de liaison archivée) ne doit pas continuer à donner accès à ce
  # bail pour le calcul de portée. Jamais testé à cette profondeur — à
  # surveiller particulièrement côté temps de réponse une fois déployé.
  # Toutes les colonnes métier incluses, y compris anonymise_le (décision
  # du 2026-08-15 : mécanisme RGPD non implémenté à ce jour — voir
  # docs/backlog.md, dette technique — mais la colonne doit déjà être
  # présente côté client pour le jour où il le sera).
  # lieu_naissance ajoutée le 2026-10-18 (chantier d'alignement du schéma) :
  # décidée exposée par cohérence avec garants.lieu_naissance et
  # locataires.date_naissance, déjà synchronisées.
  locataires:
    query: >
      SELECT id, nom, prenom, email, telephone, adresse, code_postal, ville,
      date_naissance, lieu_naissance, statut, anonymise_le, archived_at, version, updated_at
      FROM locataires
      WHERE locataires.id IN (
        SELECT locataire_id FROM bail_locataires WHERE bail_locataires.bail_id IN (
          SELECT id FROM baux WHERE baux.appartement_id IN (
            SELECT id FROM appartements WHERE appartements.bien_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          )
        )
        AND bail_locataires.archived_at IS NULL
      )
    auto_subscribe: true

  # Domaine Finances.
  # Même profondeur que baux (3 niveaux : bail_id -> appartement_id ->
  # bien_id -> bien.organisation_id -> utilisateurs, migré le 2026-08-26),
  # bail_id étant une FK directe sur paiements. Aucune colonne exclue —
  # rien de sensible identifié sur cette table (statut est calculé, jamais
  # saisi directement — voir docs/data-dictionary.md).
  # loyer_hors_charges/charges ajoutées le 2026-10-18 (chantier
  # d'alignement du schéma) : colonnes Drizzle ajoutées pour Quittance
  # Étape 4 (genererEcheancesRecurrentes fige ces montants à l'échéance),
  # jamais reportées ici jusqu'à présent.
  paiements:
    query: >
      SELECT id, bail_id, type, statut, montant, loyer_hors_charges,
      charges, date_echeance, archived_at, version, updated_at
      FROM paiements
      WHERE paiements.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.bien_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      )
    auto_subscribe: true

  # Même chaîne de filtrage que paiements, un niveau de plus (paiement_id ->
  # bail_id -> appartement_id -> bien_id -> bien.organisation_id ->
  # utilisateurs, 4 niveaux, comme locataires — migré le 2026-08-26).
  # reference_rapprochement EXCLUE volontairement (libellé brut de ligne de
  # relevé bancaire importé — hors de notre contrôle, potentiellement
  # porteur d'informations non maîtrisées selon la banque émettrice —
  # décision du 2026-08-16). Toutes les autres colonnes métier incluses.
  versements:
    query: >
      SELECT id, paiement_id, montant, date_versement, mode, archived_at, version, updated_at
      FROM versements
      WHERE versements.paiement_id IN (
        SELECT id FROM paiements WHERE paiements.bail_id IN (
          SELECT id FROM baux WHERE baux.appartement_id IN (
            SELECT id FROM appartements WHERE appartements.bien_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          )
        )
      )
    auto_subscribe: true

  # Deux FK vers deux niveaux différents (bail_id, ancre stable toujours
  # présente ; paiement_id, nullable, lien optionnel vers l'échéance
  # d'origine) — filtrage sur bail_id uniquement, même profondeur que
  # paiements (4 niveaux), pas besoin de passer par paiement_id puisque tout
  # paiement lié appartient nécessairement au même bail.
  # commentaire EXCLU volontairement (texte libre non contraint, saisi
  # manuellement, contenu imprévisible — décision du 2026-08-16).
  # Motif de retenue dépôt de garantie (2026-08-24, docs/backlog.md) :
  # motif_retenue inclus (enum catégoriel fermé, rien de sensible).
  # piece_justificative_chemin EXCLU DÉFINITIVEMENT, même raison exacte que
  # documents.chemin_stockage plus haut dans ce fichier (clé du blob chiffré
  # — sa présence en clair permettrait de localiser/déchiffrer le contenu
  # réel du justificatif). piece_justificative_nom_fichier/mime_type/
  # taille_octets inclus par le même précédent que documents.nom_fichier
  # (utilité pratique hors-ligne, disque déjà chiffré). Toutes les autres
  # colonnes métier incluses.
  remboursements:
    query: >
      SELECT id, bail_id, paiement_id, type, montant_origine,
      montant_rembourse, date_remboursement, mode, motif_retenue,
      piece_justificative_nom_fichier, piece_justificative_mime_type,
      piece_justificative_taille_octets, archived_at, version, updated_at
      FROM remboursements
      WHERE remboursements.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.bien_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      )
    auto_subscribe: true

# Domaine Alertes (2026-08-16) :
#
# - alertes REPORTÉ après le domaine Documents (pas encore de Sync Stream
#   documents à ce jour) — RÉSOLU le 2026-08-21, voir le stream alertes
#   plus bas dans ce fichier. Raison du report à l'époque :
#   alertes.entite_id est une référence polymorphe — la table cible
#   dépend de alertes.type (baux pour bail_fin_proche, paiements pour
#   impaye, documents pour document_expire/document_expire_proche,
#   equipements pour entretien_equipement), sans FK possible (voir
#   commentaire du schéma Drizzle, packages/db/src/schema/alertes.ts).
#   Impossible d'écrire la branche document_expire/document_expire_proche
#   du filtre tant que le Sync Stream documents lui-même n'était pas
#   conçu — les deux dépendaient l'un de l'autre.
#
# - parametres_alertes : config globale mono-utilisateur (une ligne par
#   type d'alerte, 5 lignes maximum, contrainte d'unicité sur `type`),
#   sans rattachement SCI/utilisateur d'aucune sorte (pas de colonne de
#   ce type sur cette table) — synchronisée sans filtre par hiérarchie,
#   contrairement à tous les streams précédents. Rien de sensible (un enum
#   type + un entier seuil_jours_avant) — toutes les colonnes incluses.
  parametres_alertes:
    query: >
      SELECT id, type, seuil_jours_avant, archived_at, version, updated_at FROM parametres_alertes
    auto_subscribe: true

  # Domaine Références globales.
  # Table de référence réglementaire (série INSEE BDM 001515333), sans
  # rattachement SCI/utilisateur — synchronisée sans filtre par hiérarchie,
  # comme parametres_alertes. Rien de sensible.
  # Pas de colonne updated_at sur cette table (contrairement à tous les
  # streams précédents) : indices_irl n'a volontairement pas les
  # auditColumns standard (une valeur IRL publiée n'est jamais modifiée,
  # voir commentaire du schéma Drizzle, packages/db/src/schema/
  # indices-irl.ts) — date_recuperation en tient lieu.
  # Confirmé le 2026-08-19 (requête directe sur pg_publication_tables,
  # script jetable check-publication-indices-irl.ts, supprimé après usage) :
  # indices_irl fait bien partie de la publication Postgres powersync,
  # contrairement à journal_audit qui en est structurellement exclue —
  # sans quoi ce stream n'aurait jamais pu recevoir de données.
  # Colonnes réordonnées le 2026-08-19 (aucun changement de comportement,
  # sélection par nom) : après déploiement, souscription active côté
  # client mais ps_buckets ne contenait jamais aucune entrée pour ce
  # stream (contrairement à elements_inventaire_meuble, déployé le même
  # jour, qui a un bucket fonctionnel dès le premier essai) — REPLICA
  # IDENTITY vérifié identique aux autres tables, dashboard PowerSync
  # "All clear". Hypothèse restante : échec d'initialisation du bucket au
  # tout premier déploiement (source vide à l'époque), jamais retenté
  # depuis. Ce changement force un nouveau hash de définition côté
  # PowerSync pour provoquer une réinitialisation du bucket, sans autre
  # effet — voir docs/backlog.md pour le suivi.
  # Résolu par la suite : le contournement décrit dans docs/backlog.md
  # (« Bug de backfill initial PowerSync ») a corrigé la réplication côté
  # PowerSync Cloud le 2026-08-20. La confirmation côté client a dû
  # attendre le 2026-10-22 (voir l'en-tête de ce fichier) : la base locale
  # ne s'ouvrait pas du tout, pour une raison sans rapport avec ce stream.
  indices_irl:
    query: >
      SELECT id, date_recuperation, annee, trimestre, valeur FROM indices_irl
    auto_subscribe: true

  # Catalogue de référence fixe (~85 lignes, seed déjà réalisé — voir
  # commentaire du schéma Drizzle), sans rattachement SCI/utilisateur —
  # synchronisée sans filtre par hiérarchie. Rien de sensible.
  elements_inventaire_meuble:
    query: >
      SELECT id, code, libelle, categorie, ordre_affichage, archived_at, version, updated_at
      FROM elements_inventaire_meuble
    auto_subscribe: true

  # Préparé le 2026-08-20, corrigé le 2026-08-20 (UNION ALL à 5 branches
  # initial rejeté par le dashboard PowerSync : "Expected a SELECT
  # statement, Invalid position for subqueries. Subqueries are only
  # supported in WHERE clauses" — UNION/set operations explicitement non
  # supportés par les Sync Streams, voir docs.powersync.com/sync/
  # supported-sql. Réécrit en un seul SELECT avec un WHERE à 5 blocs OR,
  # chaque bloc restant un filtre autonome avec sa propre sous-requête IN
  # — forme explicitement supportée par la doc officielle) — voir
  # docs/backlog.md pour le suivi. Domaine Documents, le plus sensible de
  # ce chantier.
  # chemin_stockage EXCLU DÉFINITIVEMENT et ne devra JAMAIS être ajouté à
  # cette liste de colonnes, quelle que soit l'évolution future de ce
  # stream : c'est la clé/chemin du blob chiffré sur disque
  # (docs/data-dictionary.md) — sa présence en clair dans la base SQLite
  # locale permettrait de localiser et déchiffrer le contenu réel du
  # document, contrairement à une simple réponse HTTP éphémère (risque
  # déjà traité une fois côté API REST, DocumentsService.versDto). Vérifié
  # ligne par ligne le 2026-08-20 : absent des 2 requêtes ci-dessous.
  # nom_fichier inclus (utilité pratique hors-ligne, disque déjà chiffré
  # — décision du 2026-08-20), malgré un contenu potentiellement
  # révélateur selon le nom donné par l'utilisateur à l'upload (ex.
  # "CNI_Jean_Dupont.jpg") — pas de mécanisme d'anonymisation, accepté tel
  # quel.
  # entite_id est une référence polymorphe sur 11 cibles au total côté
  # Drizzle (sci, immeuble, bien, appartement, locataire, bail,
  # etat_des_lieux, garant, depense, candidat, sinistre — voir commentaire
  # du schéma Drizzle, packages/db/src/schema/documents.ts). 10 branches
  # couvertes ici (2026-08-21, domaine État des lieux traité ; 2026-08-24,
  # 7e branche garant ajoutée — checklist documentaire ; 2026-08-26, 8e
  # branche bien ajoutée — migration bien, docs/backlog.md : seul chemin
  # possible pour un bien non-immeuble ou un immeuble créé après cette
  # date via BienService, la branche 'immeuble' restant réservée aux
  # documents déjà rattachés à une ligne immeubles existante ; 2026-10-21,
  # 9e et 10e branches depense/sinistre ajoutées, filtrage par
  # depense.organisation_id/sinistre.organisation_id — colonnes directes,
  # pas de chaîne bien à traverser) — chacune avec sa propre condition
  # entite_type = '...' AND entite_id IN (chaîne de filtrage habituelle
  # vers la table cible correspondante, jusqu'à 5 niveaux de profondeur
  # pour la branche etat_des_lieux — un cran de plus que locataire, migré
  # le 2026-08-26 vers la chaîne bien_id -> bien.organisation_id pour les
  # branches appartement/bail/garant/locataire/etat_des_lieux — jamais
  # testé à cette profondeur avant ce stream, à surveiller côté temps de
  # réponse une fois déployé). 11e cible 'candidat' volontairement non
  # couverte — voir la décision permanente plus bas dans ce fichier
  # (candidat jamais publiée).
  # candidat_role ajoutée le 2026-10-18 (chantier d'alignement du
  # schéma) : colonne Drizzle ajoutée pour le module Candidats, jamais
  # reportée ici jusqu'à présent. Rappel (packages/db/src/schema/
  # documents.ts) : renseignée UNIQUEMENT quand entite_type='candidat' —
  # or cette branche n'existe pas dans le WHERE ci-dessous et n'est pas
  # prévue (candidat jamais publiée, voir plus bas dans ce fichier).
  # Conséquence : cette colonne arrivera donc toujours NULL côté client
  # en pratique aujourd'hui ; exposée quand même par décision explicite
  # (complétude du schéma), sans effet fonctionnel actuel.
  documents:
    query: >
      SELECT id, entite_type, entite_id, categorie, statut, date_expiration,
      nom_fichier, mime_type, taille_octets, etat_des_lieux_piece_type,
      etat_des_lieux_piece_numero, document_precedent_id, candidat_role,
      archived_at, version, updated_at FROM documents
      WHERE (
        documents.entite_type = 'sci' AND documents.entite_id IN (
          SELECT organisation_sci.sci_id FROM organisation_sci
          INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
          WHERE utilisateurs.id = auth.user_id()
          AND organisation_sci.date_fin IS NULL
        )
      ) OR (
        documents.entite_type = 'immeuble' AND documents.entite_id IN (
          SELECT id FROM immeubles_legacy WHERE immeubles_legacy.sci_id IN (
            SELECT organisation_sci.sci_id FROM organisation_sci
            INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
            WHERE utilisateurs.id = auth.user_id()
            AND organisation_sci.date_fin IS NULL
          )
        )
      ) OR (
        documents.entite_type = 'bien' AND documents.entite_id IN (
          SELECT id FROM bien WHERE bien.organisation_id IN (
            SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
          )
        )
      ) OR (
        documents.entite_type = 'appartement' AND documents.entite_id IN (
          SELECT id FROM appartements WHERE appartements.bien_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      ) OR (
        documents.entite_type = 'bail' AND documents.entite_id IN (
          SELECT id FROM baux WHERE baux.appartement_id IN (
            SELECT id FROM appartements WHERE appartements.bien_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          )
        )
      ) OR (
        documents.entite_type = 'garant' AND documents.entite_id IN (
          SELECT id FROM garants WHERE garants.bail_id IN (
            SELECT id FROM baux WHERE baux.appartement_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          )
        )
      ) OR (
        documents.entite_type = 'locataire' AND documents.entite_id IN (
          SELECT locataire_id FROM bail_locataires WHERE bail_locataires.bail_id IN (
            SELECT id FROM baux WHERE baux.appartement_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          )
          AND bail_locataires.archived_at IS NULL
        )
      ) OR (
        documents.entite_type = 'etat_des_lieux' AND documents.entite_id IN (
          SELECT id FROM etats_des_lieux WHERE etats_des_lieux.bail_id IN (
            SELECT id FROM baux WHERE baux.appartement_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          )
        )
      ) OR (
        documents.entite_type = 'depense' AND documents.entite_id IN (
          SELECT id FROM depense WHERE depense.organisation_id IN (
            SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
          )
        )
      ) OR (
        documents.entite_type = 'sinistre' AND documents.entite_id IN (
          SELECT id FROM sinistre WHERE sinistre.organisation_id IN (
            SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
          )
        )
      )
    auto_subscribe: true

  # Préparé le 2026-08-20, corrigé le 2026-08-20 (même correction UNION
  # ALL -> OR que documents ci-dessus), complété le 2026-08-21 (6e branche
  # etat_des_lieux, domaine État des lieux désormais traité), complété le
  # 2026-08-24 (7e branche garant), le 2026-08-26 (8e branche bien,
  # migration bien) et le 2026-10-21 (9e/10e branches depense/sinistre,
  # mêmes raisons que sur documents ci-dessus — colonnes organisation_id
  # directes, pas de chaîne bien).
  # Relation 1:1 avec documents, FK simple document_id (pas de référence
  # polymorphe propre à cette table — voir commentaire du schéma Drizzle).
  # Filtrage par document_id IN (la requête documents ci-dessus,
  # répétée ici en ne sélectionnant que id) : la requête la plus profonde
  # et la plus complexe de ce chantier à ce jour (9 blocs OR imbriqués
  # dans un IN, jusqu'à 5 niveaux de profondeur pour la branche
  # etat_des_lieux, migré le 2026-08-26) — à surveiller particulièrement
  # côté temps de réponse une fois déployé.
  # Aucune colonne exclue — rien de sensible identifié sur cette table
  # (que des valeurs réglementaires chiffrées/catégorielles, aucune donnée
  # nominative ni chemin de fichier).
  diagnostics:
    query: >
      SELECT id, document_id, type, classe_dpe, depenses_theoriques_chauffage,
      risque_present, archived_at, version, updated_at FROM diagnostics
      WHERE diagnostics.document_id IN (
        SELECT id FROM documents WHERE (
          documents.entite_type = 'sci' AND documents.entite_id IN (
            SELECT organisation_sci.sci_id FROM organisation_sci
            INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
            WHERE utilisateurs.id = auth.user_id()
            AND organisation_sci.date_fin IS NULL
          )
        ) OR (
          documents.entite_type = 'immeuble' AND documents.entite_id IN (
            SELECT id FROM immeubles_legacy WHERE immeubles_legacy.sci_id IN (
              SELECT organisation_sci.sci_id FROM organisation_sci
              INNER JOIN utilisateurs ON utilisateurs.organisation_id = organisation_sci.organisation_id
              WHERE utilisateurs.id = auth.user_id()
              AND organisation_sci.date_fin IS NULL
            )
          )
        ) OR (
          documents.entite_type = 'bien' AND documents.entite_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        ) OR (
          documents.entite_type = 'appartement' AND documents.entite_id IN (
            SELECT id FROM appartements WHERE appartements.bien_id IN (
              SELECT id FROM bien WHERE bien.organisation_id IN (
                SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
              )
            )
          )
        ) OR (
          documents.entite_type = 'bail' AND documents.entite_id IN (
            SELECT id FROM baux WHERE baux.appartement_id IN (
              SELECT id FROM appartements WHERE appartements.bien_id IN (
                SELECT id FROM bien WHERE bien.organisation_id IN (
                  SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                )
              )
            )
          )
        ) OR (
          documents.entite_type = 'garant' AND documents.entite_id IN (
            SELECT id FROM garants WHERE garants.bail_id IN (
              SELECT id FROM baux WHERE baux.appartement_id IN (
                SELECT id FROM appartements WHERE appartements.bien_id IN (
                  SELECT id FROM bien WHERE bien.organisation_id IN (
                    SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                  )
                )
              )
            )
          )
        ) OR (
          documents.entite_type = 'locataire' AND documents.entite_id IN (
            SELECT locataire_id FROM bail_locataires WHERE bail_locataires.bail_id IN (
              SELECT id FROM baux WHERE baux.appartement_id IN (
                SELECT id FROM appartements WHERE appartements.bien_id IN (
                  SELECT id FROM bien WHERE bien.organisation_id IN (
                    SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                  )
                )
              )
            )
            AND bail_locataires.archived_at IS NULL
          )
        ) OR (
          documents.entite_type = 'etat_des_lieux' AND documents.entite_id IN (
            SELECT id FROM etats_des_lieux WHERE etats_des_lieux.bail_id IN (
              SELECT id FROM baux WHERE baux.appartement_id IN (
                SELECT id FROM appartements WHERE appartements.bien_id IN (
                  SELECT id FROM bien WHERE bien.organisation_id IN (
                    SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
                  )
                )
              )
            )
          )
        ) OR (
          documents.entite_type = 'depense' AND documents.entite_id IN (
            SELECT id FROM depense WHERE depense.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        ) OR (
          documents.entite_type = 'sinistre' AND documents.entite_id IN (
            SELECT id FROM sinistre WHERE sinistre.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      )
    auto_subscribe: true

# Domaine Documents (2026-08-20) : RÉSOLU le 2026-08-21 — la 6e branche
# etat_des_lieux a été ajoutée aux requêtes documents et diagnostics
# ci-dessus, une fois le domaine État des lieux traité. Complété le
# 2026-08-24 (7e branche garant, checklist documentaire) et le 2026-08-26
# (8e branche bien, migration bien) — les 8 branches de la référence
# polymorphe documents.entite_id sont désormais toutes couvertes.

  # Domaine État des lieux, le plus étendu de ce chantier (12 tables).
  # Table racine : bail_id
  # unique (un seul état des lieux par bail, document unique
  # entrée+sortie, décret n° 2016-382 art. 3, 2°). Même chaîne de
  # filtrage que baux lui-même (bail_id -> appartement_id -> bien_id ->
  # bien.organisation_id -> utilisateurs, 3 niveaux, migré le 2026-08-26) —
  # toutes les tables satellites ci-dessous en ajoutent un 4e
  # (etat_des_lieux_id -> etats_des_lieux.bail_id -> ...). Aucune colonne
  # exclue — nouvelle_adresse_locataire incluse (cohérent avec
  # locataires.adresse déjà accepté, décision du 2026-08-20).
  etats_des_lieux:
    query: >
      SELECT id, bail_id, date_entree, date_sortie, nouvelle_adresse_locataire,
      archived_at, version, updated_at FROM etats_des_lieux
      WHERE etats_des_lieux.bail_id IN (
        SELECT id FROM baux WHERE baux.appartement_id IN (
          SELECT id FROM appartements WHERE appartements.bien_id IN (
            SELECT id FROM bien WHERE bien.organisation_id IN (
              SELECT organisation_id FROM utilisateurs WHERE utilisateurs.id = auth.user_id()
            )
          )
        )
      )
    auto_subscribe: true

