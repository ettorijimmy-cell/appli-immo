name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/appli_immo_test
  # Placeholder — aucun backend n'est encore déployé sur Scaleway. Sert
  # uniquement à satisfaire le garde-fou de build de production dans
  # apps/desktop/electron.vite.config.ts (VITE_API_URL obligatoire hors
  # dev) ; à remplacer par l'origine réelle une fois déployée.
  VITE_API_URL: https://api.appli-immo.example.com

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appli_immo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Appliquer les migrations Drizzle sur le Postgres éphémère
        run: pnpm --filter db db:migrate

      # Sans ce seed, elements_inventaire_meuble reste vide sur un Postgres
      # neuf — plusieurs tests d'intégration État des lieux en dépendent
      # (catalogue de 88 lignes). Absent jusqu'ici car ce pipeline n'avait
      # jamais tourné pour de vrai (voir docs/error-log.md, [2026-08-10]) ;
      # en local, la base de dev déjà seedée masquait la dépendance.
      - name: Seeder le catalogue inventaire meublé
        run: pnpm seed:inventaire-meuble

      - name: Test d'intégration — flux de connexion (Argon2 + JWT) contre un vrai Postgres
        run: pnpm test:integration

      - run: pnpm build
