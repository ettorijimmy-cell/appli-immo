name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/appli_immo_test

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appli_immo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Appliquer les migrations Drizzle sur le Postgres éphémère
        run: pnpm --filter db db:migrate

      - name: Test d'intégration — flux de connexion (Argon2 + JWT) contre un vrai Postgres
        run: pnpm test:integration

      - run: pnpm build
