name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/appli_immo_test
  # Placeholder — aucun backend n'est encore déployé sur Scaleway. Sert
  # uniquement à satisfaire le garde-fou de build de production dans
  # apps/desktop/electron.vite.config.ts (VITE_API_URL obligatoire hors
  # dev) ; à remplacer par l'origine réelle une fois déployée.
  VITE_API_URL: https://api.appli-immo.example.com

jobs:
  ci:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appli_immo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Appliquer les migrations Drizzle sur le Postgres éphémère
        run: pnpm --filter db db:migrate

      # Sans ce seed, elements_inventaire_meuble reste vide sur un Postgres
      # neuf — plusieurs tests d'intégration État des lieux en dépendent
      # (catalogue de 88 lignes). Absent jusqu'ici car ce pipeline n'avait
      # jamais tourné pour de vrai (voir docs/error-log.md, [2026-08-10]) ;
      # en local, la base de dev déjà seedée masquait la dépendance.
      - name: Seeder le catalogue inventaire meublé
        run: pnpm seed:inventaire-meuble

      # Seed unique, en série, avant Vitest : AlertesConfigService.
      # creerAvecDefaut() peuple normalement parametres_alertes à la
      # volée au premier accès, mais plusieurs fichiers d'intégration
      # déclenchent ce premier accès en parallèle contre ce même
      # Postgres — deadlock reproductible (voir docs/backlog.md). Avec ce
      # seed, chaque test trouve la ligne déjà là, plus aucun INSERT ne
      # s'y dispute.
      - name: Seeder les paramètres d'alertes par défaut
        run: pnpm seed:parametres-alertes

      - name: Test d'intégration — flux de connexion (Argon2 + JWT) contre un vrai Postgres
        run: pnpm test:integration

      - run: pnpm build

      # Clé liée à la version exacte de Playwright, via le lockfile.
      - name: Restaurer le navigateur Playwright
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Installer Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm --filter mobile-web exec playwright install --with-deps chromium

      # Le cache ne contient que le navigateur, pas ses dépendances système.
      - name: Installer les dépendances système de Chromium
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm --filter mobile-web exec playwright install-deps chromium

      # Après le build : le mobile consomme packages/core compilé. Les harnais
      # simulent l'API sur localhost:3000, d'où la surcharge de VITE_API_URL.
      - name: Tests navigateur mobile-web (Playwright)
        env:
          VITE_API_URL: http://localhost:3000
        run: pnpm --filter mobile-web test:e2e

      - name: Conserver les traces Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/mobile-web/test-results/
          retention-days: 7
