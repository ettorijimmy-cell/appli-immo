name: appli-immo-test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appli_immo_test
    ports:
      # 5434 côté hôte : jamais 5433 (Postgres de dev, docker-compose.yml) ni
      # 5432 (potentiellement déjà occupé) — base entièrement jetable pour
      # scripts/test-integration-clean.mjs, recréée à chaque lancement.
      - "5434:5432"
    volumes:
      - appli_immo_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  appli_immo_pg_test_data:
